# Config for scripts/benchmark_models.py
#
# Candidate detector models, ordered by what one frame at camera resolution
# actually cost when billed, not by per-token price — those two orderings
# disagree badly, because models tokenize the same 2304x1296 frame anywhere
# from 317 to 36,901 tokens. Comments below are measured $/call from
# scripts/probe_model_costs.py, which is what to re-run to refresh this list.
#
# An entry may be a bare model id or a mapping with `max_tokens` and
# `reasoning_effort` overrides. Reasoning models need both: at the daemon's
# old 64-token budget they spend every token thinking and return an empty
# completion, which scores as a uniform "no bird".

models:
  - google/gemma-4-26b-a4b-it               # 0.000015
  - rekaai/reka-edge                        # 0.000039
  - mistralai/ministral-3b-2512             # 0.000070
  - nex-agi/nex-n2-mini                     # 0.000074
  - qwen/qwen3.7-flash                      # 0.000085
  - amazon/nova-2-lite-v1                   # 0.000110
  - bytedance-seed/seed-1.6-flash           # 0.000128
  - amazon/nova-lite-v1                     # 0.000131
  - id: bytedance-seed/seed-2.0-mini        # 0.000154 - current default
    max_tokens: 512
  - google/gemini-3.1-flash-image-preview   # 0.000161
  - mistralai/mistral-small-3.2-24b-instruct  # 0.000162
  - id: qwen/qwen3.5-flash-02-23            # 0.000183
    max_tokens: 512
  - google/gemini-2.5-flash-lite            # 0.000187
  - id: openai/gpt-5-nano                   # 0.000202
    max_tokens: 512
    reasoning_effort: minimal
  - meta-llama/llama-4-scout                # 0.000240
  - stepfun/step-3.7-flash                  # 0.000284
  - google/gemini-3.1-flash-lite            # 0.000291
  - id: z-ai/glm-5.3-flash                  # 0.000314
    max_tokens: 512
  - id: openai/gpt-5-mini                   # 0.000317
    max_tokens: 512
    reasoning_effort: minimal
  - google/gemini-3.5-flash-lite            # 0.000350
  - google/gemini-3-flash-preview           # 0.000581 - previous default
  - anthropic/claude-haiku-4.5              # 0.001652

# Yes/no classification prompt. Keep in sync with detector_prompt in
# config.yaml so the benchmark measures what production actually asks.
# Use --prompt-file to score a candidate rewording against this one.
classification_prompt: |
  You are a bird detector for a backyard pool. Respond with exactly 'yes' if
  you see one or more birds on the pool deck, in the pool water, or in flight
  directly above it. Birds beyond the fence — on the lake, on the far bank, on
  neighbouring roofs — do not count, and neither do towels, cushions, planters
  or pool toys. Respond with exactly 'no' otherwise. Output only the single
  word.
